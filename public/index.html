<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>阳湖智能体 — 武进非遗文旅AI向导</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- API 配置界面 -->
  <div class="config-overlay" id="configOverlay">
    <div class="config-backdrop"></div>
    <div class="config-card">
      <div class="config-card-inner">
        <div class="config-seal">文</div>
        <h2 class="config-title">阳湖智能体</h2>
        <p class="config-subtitle">武进非遗文旅 · AI数字向导</p>
        <div class="config-divider">
          <span></span><span>API 配置</span><span></span>
        </div>
        <p class="config-desc">
          请输入您的 <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener">DeepSeek API Key</a>，<br>开启与阳湖五位文人的对话之旅。
        </p>
        <div class="config-input-group">
          <input
            type="password"
            id="apiKeyInput"
            class="config-input"
            placeholder="sk-xxxxxxxxxxxxxxxx"
            autocomplete="off"
          />
          <button class="config-toggle-vis" id="toggleKeyVis" title="显示/隐藏" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <button class="config-btn" id="btnSaveKey">
          <span class="config-btn-text">开启文枢之门</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
        <p class="config-error" id="configError"></p>
        <p class="config-hint">
          Key 仅保存在您的浏览器本地，不会上传至任何服务器。
        </p>
      </div>
    </div>
  </div>

  <div class="app-container">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-seal">湖</span>
          <div class="logo-text">
            <h1>阳湖智能体</h1>
            <p>武进非遗 · 阳湖文枢</p>
          </div>
        </div>
      </div>

      <div class="sidebar-actions">
        <button class="btn-new-chat" id="btnNewChat" title="开启新对话">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>新对话</span>
        </button>
      </div>

      <nav class="conversation-list" id="conversationList">
        <!-- 对话列表由 JS 动态生成 -->
      </nav>

      <div class="sidebar-footer">
        <button class="btn-settings" id="btnSettings" title="API 设置">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>API 设置</span>
        </button>
        <div class="footer-info">
          <p class="footer-tagline">破 · 真 · 融 · 寄 · 新 · 达</p>
          <p class="footer-credit">AI生成，仅供参考</p>
        </div>
      </div>
    </aside>

    <!-- 主对话区 -->
    <main class="main-chat" id="mainChat">
      <!-- 空状态 -->
      <div class="chat-empty" id="chatEmpty">
        <div class="empty-content">
          <div class="empty-seal">文</div>
          <h2>阳湖文枢</h2>
          <p class="empty-subtitle">武进非遗文旅AI数字向导</p>
          <div class="empty-ink-splash"></div>
          <div class="empty-scholars">
            <span>南田先生 · 书画美学</span>
            <span>瓯北先生 · 历史导览</span>
            <span>子居先生 · 文化礼仪</span>
            <span>皋文先生 · 诗词吟诵</span>
            <span>伯元先生 · 市井美食</span>
          </div>
          <div class="empty-hints">
            <p>试着问我：</p>
            <button class="hint-btn" data-hint="什么是乱针绣？它有什么独特之处？">什么是乱针绣？</button>
            <button class="hint-btn" data-hint="推荐一条武进非遗一日游的路线">武进非遗一日游路线</button>
            <button class="hint-btn" data-hint="阳湖十二时辰是什么体验？价格多少？">阳湖十二时辰体验</button>
            <button class="hint-btn" data-hint="介绍一下常州梳篦的历史和文化">常州梳篦的历史</button>
          </div>
        </div>
      </div>

      <!-- 消息列表 -->
      <div class="chat-messages" id="chatMessages">
        <!-- 消息由 JS 动态生成 -->
      </div>

      <!-- 输入区 -->
      <div class="chat-input-area" id="chatInputArea">
        <div class="input-wrapper">
          <textarea
            id="messageInput"
            placeholder="向五位先生请教武进非遗..."
            rows="1"
            maxlength="2000"
          ></textarea>
          <div class="input-actions">
            <button class="btn-stop" id="btnStop" title="停止生成">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <rect x="4" y="4" width="16" height="16" rx="2"></rect>
              </svg>
            </button>
            <button class="btn-send" id="btnSend" title="发送">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
        </div>
        <p class="input-hint">Enter 发送 · Shift+Enter 换行</p>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
